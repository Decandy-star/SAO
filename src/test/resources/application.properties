# 测试专用覆盖（优先级高于 src/main/resources/application.yml 的同名键）。
#
# 关掉「启动时把当月签到碎片刷进 tables/QianDao.txt」：
# 每个测试类自带独立 sao.world-dir（target\classes\data\world-test-* 等），
# 但 sao.tables-dir 是共用的模块根 tables\ —— 开着的话最后一个启动的测试上下文
# 会把 live 表刷成它那本测试档的碎片（实测把 live 的 SP040 刷成了 SP046），
# 于是 live 表与 live data\world\signin-month.json 又不一致。
# 需要验证 patch 本身时走 admin 的 /admin/signin-month/publish|reroll（显式 patch，不受本开关影响）。
sao.signin-patch-table=false
